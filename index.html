function vHist(){const L=all().filter(r=>r.out),mm=P?missed():[];return '<div class="h" style="font-size:22px;font-weight:700;color:var(--g);margin-bottom:12px">Riwayat Kehadiran</div>'+mm.map(s=>'<div class="c"><b class="h">'+E(P.n)+'</b> <span class="m">'+fd(s)+'</span><div class="bad">Tidak hadir</div></div>').join('')+(L.length?L.map(r=>'<div class="c"><b class="h">'+E(r.n)+'</b> <span class="m">'+E(r.d)+'</span><div class="m">'+fd(r.date)+'</div><div>'+(r.sh=='bebas'?'Fleksibel':'Shift '+r.sh)+' · Masuk '+r.in+' · Pulang '+r.out+'</div><div class="'+(r.st=='Terlambat'?'bad':'ok')+'">'+r.st+(r.ln?' ke-'+r.ln:'')+(r.sp?' · SP '+r.sp:'')+(r.st=='Tepat waktu'?' · +2 poin':'')+'</div>'+(r.rs?'<div class="m">Alasan: '+E(r.rs)+'</div>':'')+'<div class="m">'+(r.tasks||[]).length+' tugas'+(r.plat!=null?' · <a href="https://maps.google.com/?q='+r.plat+','+r.plng+'" target="_blank" rel="noopener">Lokasi</a>':'')+'</div></div>').join(''):'<div class="c m">Belum ada riwayat.</div>')}

async function loadTask(){let h='Tugas tidak ditemukan.';try{const s=await DB.doc('tasks/'+location.hash.slice(3)).get();if(s.exists){const d=s.data();h='<b class="h">'+E(d.n)+'</b> <span class="m">'+E(d.d)+'</span><div class="m">'+fd(d.date)+' · '+d.in+'–'+d.out+'</div><p>'+E(d.t)+'</p>'+(d.l?'<a href="'+E(d.l)+'" target="_blank" rel="noopener">Buka link hasil</a>':'')}}catch(e){}const e=$('#tk');if(e)e.innerHTML=h}
function pad(){const c=$('#sg');if(!c)return;const x=c.getContext('2d'),p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};let d=0;x.strokeStyle='#F0C58D';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const q=p(e);x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(q[0]+.1,q[1]);x.stroke()};c.onpointermove=e=>{if(!d)return;const q=p(e);x.lineTo(q[0],q[1]);x.stroke()};c.onpointerup=()=>{d=0;SIGOK=1;SIG=new Image();SIG.src=c.toDataURL()}}
